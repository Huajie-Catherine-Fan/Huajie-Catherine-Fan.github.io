        <main>

        <h2>
            <i>Qianfo</i> <span lang="zh">千佛</span>
        </h2>


        <div id="gallery" class="justified-gallery">

            <a
                href="images/台州临海巾山千佛塔.jpeg"
                class="glightbox"
                data-gallery="qianfo-gallery"
                data-title="Jinshan Qianfo Pagoda"
                data-description="Linhai, Taizhou, Zhejiang. Photograph by the author."
            >
                <img
                    src="images/台州临海巾山千佛塔.jpeg"
                    alt="Qianfo Pagoda in Linhai, Taizhou"
                >
            </a>


            <a
                href="images/温州国安寺塔.jpeg"
                class="glightbox"
                data-gallery="qianfo-gallery"
                data-title="Guo'an Temple Pagoda"
                data-description="Wenzhou, Zhejiang. Photograph by the author."
            >
                <img
                    src="images/温州国安寺塔.jpeg"
                    alt="Qianfo Pagoda in Wenzhou"
                >
            </a>


            <a
                href="images/湖州飞英内塔.jpeg"
                class="glightbox"
                data-gallery="qianfo-gallery"
                data-title="Feiying Inner Pagoda"
                data-description="Huzhou, Zhejiang. Photograph by the author."
            >

                    src="images/湖州飞英内塔.jpeg"

            </a>


            <a
                href="images/台州天台国清大塔.jpeg"
                class="glightbox"
                data-gallery="qianfo-gallery"

                    alt="Qianfo Pagoda in Tiantai, Taizhou"

    <script type="module">

      import { JustifiedGallery }
         from 'https://cdn.jsdelivr.net/npm/justified-gallery@4/+esm';

     const container = document.getElementById('gallery');

     const gallery = new JustifiedGallery(container, {
         rowHeight: 200,
        margins: 8,
        lastRow: 'nojustify',
        sizeRangeSuffixes: { 0: '' }
        });

         gallery.init();

        </script>

<script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>

    <script>
        const lightbox = GLightbox({
         selector: '.glightbox',
         touchNavigation: true,
         keyboardNavigation: true,
         loop: true,
         zoomable: true,
         draggable: true
    });
</script>
